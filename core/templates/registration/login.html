<!doctype html>
<html>
<head>
    <title></title>
</head>
<body>
<h2>Página de Login</h2>
<form method="post">
    {% csrf_token %}
    <p>{{ form.username.label_tag }} {{ form.username }}</p>
    <p>{{ form.password.label_tag }} {{ form.password }}</p>


    <p><input type="submit" value="Entrar" /></p>
</form>
{% if user.is_authenticated %}
    <!-- Link para o cadastro de pontos -->
    <a href="{% url 'cadastrar_pontos' %}">Cadastrar Ponto de Coleta</a>
{% else %}
    <a href="{% url 'login' %}">Faça login para cadastrar ponto</a>
{% endif %}  
</body>
</html>
