{% extends 'base.html' %}
{% load static %}

{% block content%}

    <section class="banner">
        <h1>Cuide do planeta, descarte corretamente.</h1>
    </section>

    <!-- Seção do vídeo -->
    <section class="video-container">
        <video id="videoInfo" controls>
            <source src="{% static 'videos/descarte-eletronicos.mp4.mp4' %}" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
    </section>

    <section class="container">
        <h2>Pontos de Coleta</h2>
        <p>Encontre locais próximos para descarte correto de resíduos.</p>
        <a href="{% url 'mapa_pontos_coleta' %}">
            <button class="botao">Encontrar</button>
        </a>
        
    </section>

    <!-- Seção do Gráfico -->
    <section class="container">
        <h2>Ranking de Descarte</h2>
        <canvas id="rankingChart"></canvas>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
           
            var dados = {
                labels: ["Lucas", "Ana", "Carlos", "Mariana", "João"], // Nomes das pessoas
                datasets: [{
                    label: "Quantidade de lixo descartado (kg)",
                    data: [30, 45, 20, 50, 38], // Quantidade em kg
                    backgroundColor: ["#4CAF50", "#2196F3", "#FF9800", "#E91E63", "#9C27B0"]
                }]
            };

            var ctx = document.getElementById("rankingChart").getContext("2d");
            new Chart(ctx, {
                type: "bar",
                data: dados,
                options: {
                    responsive: true,
                    maintainAspectRatio: false, 
                    plugins: {
                        legend: { display: false } 
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        });
    </script>

    <style>
        #rankingChart {
            width: 100%;
            max-width: 800px;
            max-height: 300px;
            margin: auto;
        }
    </style>
{% endblock %}
